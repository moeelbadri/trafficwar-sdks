[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "trafficwar"
dynamic = ["version"]
description = "Official Python server SDK for TrafficWar event ingestion"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TrafficWar" }]
keywords = ["trafficwar", "events", "observability", "analytics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11,<2",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "twine>=6",
]

[project.urls]
Homepage = "https://trafficwar.tech"
Documentation = "https://trafficwar.tech"
Repository = "https://github.com/moeelbadri/trafficwar-sdks"
Issues = "https://github.com/moeelbadri/trafficwar-sdks/issues"

[tool.hatch.version]
path = "src/trafficwar/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trafficwar"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest"
lint = [
  "ruff check .",
  "ruff format --check .",
  "mypy src",
]
build = "python -m build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
follow_imports = "skip"
files = ["src"]
show_error_codes = true
warn_unused_configs = true
