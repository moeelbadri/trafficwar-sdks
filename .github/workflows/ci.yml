name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run check:examples:node
      - run: npm run test:examples:node
      - run: npm pack --workspace @trafficwar/node --dry-run
      - run: npm audit --omit=dev

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/python[dev]"
      - run: python -m pip check
      - run: ruff check .
        working-directory: packages/python
      - run: ruff format --check .
        working-directory: packages/python
      - run: mypy src
        working-directory: packages/python
      - run: pytest
        working-directory: packages/python
      - run: python -m build
        working-directory: packages/python
      - run: python -m twine check dist/*
        working-directory: packages/python
      - name: Smoke-test built wheel
        working-directory: packages/python
        run: |
          python -m venv "$RUNNER_TEMP/trafficwar-wheel"
          "$RUNNER_TEMP/trafficwar-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/trafficwar-wheel/bin/python" -c \
            "from importlib.metadata import version; import trafficwar; assert trafficwar.__version__ == version('trafficwar'); assert callable(trafficwar.TrafficWar)"

  python-examples:
    name: Python examples ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip uv
      - run: uv sync --locked --all-packages --all-extras --all-groups --python "${{ matrix.python }}"
      - run: uv run --directory examples/python/django pytest
      - run: uv run --directory examples/python/fastapi pytest
