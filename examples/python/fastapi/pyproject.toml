[project]
name = "trafficwar-fastapi-example"
version = "0.1.0"
description = "Runnable FastAPI integration example for the TrafficWar Python SDK"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "trafficwar==1.0.0",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "httpx>=0.28.1,<1",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
